name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Read one product
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          curl -fsS "$URL/rest/v1/products?select=id&limit=1" -H "apikey: $KEY"
